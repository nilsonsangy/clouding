services:
  users:
    build:
      context: ../app/users
    ports:
      - '3001:3001'
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - clouding-lab

  orders:
    build:
      context: ../app/orders
    ports:
      - '3002:3002'
    environment:
      - USERS_URL=http://users:3001
      - CATALOG_URL=http://catalog:3003
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - users
      - catalog
    networks:
      - clouding-lab

  catalog:
    build:
      context: ../app/catalog
    ports:
      - '3003:3003'
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    networks:
      - clouding-lab

  frontend:
    build:
      context: ../app/frontend
    ports:
      - '8080:80'
    depends_on:
      - users
      - orders
      - catalog
    volumes:
      - ../app/frontend:/usr/share/nginx/html:ro
    networks:
      - clouding-lab

networks:
  clouding-lab:
    name: clouding-lab
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

