# This file defines the Kubernetes environment for deploying the backend and frontend services.
# It includes Deployments and Services for both components.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1 # Number of backend replicas to ensure high availability.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: nilsonsangy/clouding-backend:latest # Docker image for the backend.
        ports:
        - containerPort: 3000 # Fixed value matching the PORT from ConfigMap
        env:
        - name: NODE_ENV
          value: "production" # Environment variable to set the backend to production mode.
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: YOUTUBE_API_KEY

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend # Links the service to the backend pods.
  ports:
    - protocol: TCP
      port: 3000 # Port exposed by the service
      targetPort: 3000 # Port exposed by the container
      nodePort: 30000 # Port exposed on the host machine
  type: NodePort # Expose the service externally

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1 # Number of frontend replicas to ensure high availability.
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nilsonsangy/clouding-frontend:latest # Docker image for the frontend
        ports:
        - containerPort: 80 # Port exposed by the frontend container
        env:
        - name: BACKEND_URL
          value: "http://backend-service:3000" # Replace with the backend service URL

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend # Links the service to the frontend pods
  ports:
    - protocol: TCP
      port: 80 # Port exposed by the service
      targetPort: 80 # Port exposed by the container
      nodePort: 30080 # Port exposed on the host machine
  type: NodePort # Expose the service externally