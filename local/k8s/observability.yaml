apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: clouding-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: users
        metrics_path: /metrics
        static_configs:
          - targets: ["users:3001"]
      - job_name: orders
        metrics_path: /metrics
        static_configs:
          - targets: ["orders:3002"]
      - job_name: catalog
        metrics_path: /metrics
        static_configs:
          - targets: ["catalog:3003"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: clouding-lab
data:
  loki-config.yml: |
    auth_enabled: false

    common:
      path_prefix: /tmp/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    server:
      http_listen_port: 3100
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /tmp/loki/index
        cache_location: /tmp/loki/cache
      filesystem:
        directory: /tmp/loki/chunks

    compactor:
      working_directory: /tmp/loki/compactor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: clouding-lab
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Daemon       off
    [INPUT]
        Name   tail
        Path   /var/lib/docker/containers/*/*-json.log
        Parser docker
        Tag    clouding.*
    [OUTPUT]
        Name   stdout
        Match  clouding.*
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: clouding-lab
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: clouding-lab
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: Clouding Lab
        orgId: 1
        folder: Clouding Lab
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-clouding-lab-dashboard
  namespace: clouding-lab
data:
  clouding-lab-dashboard.json: |
    {
      "uid": "clouding-lab",
      "title": "Clouding Lab Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": ["clouding", "incident-response"],
      "panels": [
        {
          "type": "stat",
          "title": "Users Service",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 6 },
          "targets": [
            { "expr": "users_service_up", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Orders Service",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 6 },
          "targets": [
            { "expr": "orders_service_up", "refId": "A" }
          ]
        },
        {
          "type": "stat",
          "title": "Catalog Service",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 6 },
          "targets": [
            { "expr": "catalog_service_up", "refId": "A" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: clouding-lab
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-provisioning-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-provisioning-dashboards
          configMap:
            name: grafana-dashboards-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-clouding-lab-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: clouding-lab
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.61.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: 'true'
          ports:
            - containerPort: 16686
            - containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: clouding-lab
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 31686
    - name: otlp
      port: 4318
      targetPort: 4318
      nodePort: 30418
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args:
            - -config.file=/etc/loki/loki-config.yml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /tmp/loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: clouding-lab
spec:
  type: NodePort
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.1.7
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf
          volumeMounts:
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
      volumes:
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
