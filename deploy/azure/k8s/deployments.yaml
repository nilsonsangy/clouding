apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: clouding.azurecr.io/clouding-users:latest
          imagePullPolicy: Always
          env:
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger.clouding-lab.svc.cluster.local:4318/v1/traces
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: clouding-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
        - name: orders
          image: clouding.azurecr.io/clouding-orders:latest
          imagePullPolicy: Always
          env:
            - name: USERS_URL
              value: http://users.clouding-lab.svc.cluster.local:3001
            - name: CATALOG_URL
              value: http://catalog.clouding-lab.svc.cluster.local:3003
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://jaeger.clouding-lab.svc.cluster.local:4318/v1/traces
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
