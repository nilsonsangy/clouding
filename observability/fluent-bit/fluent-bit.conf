[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

[INPUT]
    Name   tail
    Path   /var/lib/docker/containers/*/*-json.log
    Parser docker
    Tag    clouding.*

[FILTER]
    Name   modify
    Match  clouding.*
    Add    app clouding-lab

[OUTPUT]
    Name   loki
    Match  clouding.*
    Host   loki
    Port   3100
    Labels job=fluent-bit,app=clouding-lab